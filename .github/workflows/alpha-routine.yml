name: Alpha routine (做多做空模型每日/每小时优化)

# 「在 Claude 里生成一个 routine,不断 post 报告」的执行端:
#   定时运行流 B 残差统计套利引擎 + 市场快照,产出一份情报报告写入 feed/,commit 回仓。
#   静态网页(/intel 情报看板)通过 GitHub raw 直接消费 feed/,无需重建 Pages 即可看到最新。
#
# 节流:盘中每小时一次(美东 09:30–16:00 ≈ UTC 14–21),收盘后再跑一次终版;周末不跑。
# 注:GitHub 定时任务只在默认分支(main)上触发 —— 合并到 main 后自动生效。

on:
  schedule:
    - cron: "20 14-21 * * 1-5"   # 盘中每小时(UTC),每点过 20 分
    - cron: "30 22 * * 1-5"      # 收盘后 EOD 终版
  workflow_dispatch:
    inputs:
      fast:
        description: "fast 模式(缩短区间,几秒出结果)"
        type: boolean
        default: false

concurrency:
  group: alpha-routine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FEED_PUBLICATION_MANIFEST: /tmp/feed-publication-${{ github.run_id }}.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements/automation.txt
      - name: Cache 行情缓存(按天)
        uses: actions/cache@v6
        with:
          path: backtest/data_cache
          key: data-cache-${{ github.run_id }}
          restore-keys: |
            data-cache-
      - name: 安装依赖
        run: python -m pip install --require-hashes -r requirements/automation.txt
      - name: Smoke combined automation imports
        run: PYTHONPATH=backtest:scripts python -c "import factor_factory, feed_lib, run_routine, statarb"
      - name: 下载演示 universe 行情(SPY + 行业 ETF + 流动大盘)
        working-directory: backtest
        run: |
          python - <<'PY'
          import data as d, statarb as sa
          tickers = sa.DEMO_UNIVERSE + sa.SECTOR_ETFS + ["SPY"]
          res = d.fetch_universe(tickers, range_="10y", workers=12)
          ok = sum(1 for v in res.values() if v > 0)
          print(f"下载 {ok}/{len(set(tickers))} 成功")
          PY
      - name: 运行 routine,产出报告写入 feed/
        env:
          FEED_HMAC_SECRET: ${{ secrets.FEED_HMAC_SECRET }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.fast }}" = "true" ]; then ARGS="--fast"; fi
          python scripts/run_routine.py $ARGS
      - name: EOD 公式因子工厂(预算化搜索 + 六门控,仅收盘后那班跑)
        if: github.event.schedule == '30 22 * * 1-5'
        env:
          FEED_HMAC_SECRET: ${{ secrets.FEED_HMAC_SECRET }}
        run: python backtest/factor_factory.py --publish
      - name: Commit + push feed 更新
        run: |
          git config user.name  "alpha-routine[bot]"
          git config user.email "actions@github.com"
          python scripts/feed_publication.py stage "$FEED_PUBLICATION_MANIFEST"
          if git diff --cached --quiet; then
            echo "feed 无变化,跳过提交。"
          else
            git commit -m "routine: 更新情报馈送 feed/ ($(date -u +%Y-%m-%dT%H:%MZ))"
            pushed=0
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              if [ "$i" -lt 4 ]; then sleep $((2**i)); fi
            done
            if [ "$pushed" -ne 1 ]; then echo "push 重试耗尽。" >&2; exit 1; fi
          fi
