name: Keep backend warm

# Render 免费实例闲置 15 分钟会休眠,导致用户打开站点时首批请求冷启动 30-50s。
# 每 30 分钟兜底 ping(交易时段的高频保活由 intraday-report 循环内顺手完成;
# 2026-06-10:两个 <15min 高频 schedule 互相挤兑导致备胎被丢,故合并)。
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        run: |
          if [ -z "${{ vars.API_BASE }}" ]; then
            echo "API_BASE 未设置,跳过"; exit 0
          fi
          echo "ping ${{ vars.API_BASE }}/api/v1/health"
          curl -fsS --max-time 70 "${{ vars.API_BASE }}/api/v1/health" || echo "ping 失败(可能正在冷启动,下次会唤醒)"
