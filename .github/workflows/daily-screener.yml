name: Daily screener (技术评分≥80)

# 每个交易日美股收盘后扫描 标普500+纳指100,把评分≥80的清单:
#   1) 提交到 feed/screener/(供 /screener 页面实时读取)
#   2) 开一个 GitHub Issue 并指派给仓库所有者(GitHub 会邮件通知你)
on:
  schedule:
    # 美股收盘 16:00 ET ≈ 20:00/21:00 UTC;留富余在 22:30 UTC 周一到周五跑
    - cron: "30 22 * * 1-5"
  push:
    paths: ["backend/app/analysis/signals.py", "scripts/daily_screener.py"]
    branches: [main]
  workflow_dispatch:
    inputs:
      threshold:
        description: "技术评分阈值"
        default: "80"

permissions:
  contents: write   # 提交 feed/screener
  issues: write     # 创建 Issue

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --require-hashes -r backend/requirements.txt
      - name: 扫描并生成清单
        run: python scripts/daily_screener.py --threshold ${{ github.event.inputs.threshold || '80' }} --concurrency 10

      - name: 提交清单到 feed/screener
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/screener feed/watchlist.json feed/signals/rs-ranks.json feed/signals/rs-history.json
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "screener: 每日技术评分清单 $(date -u +%F)"
          pushed=0
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then pushed=1; break; fi
            if [ "$i" -lt 4 ]; then sleep $((2**i)); fi
          done
          if [ "$pushed" -ne 1 ]; then echo "::error::push 重试耗尽(4 次)"; exit 1; fi

      - name: 创建/更新当日 Issue(同日去重防刷屏,旧日自动关闭)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%F)
          THRESH="${{ github.event.inputs.threshold || '80' }}"
          COUNT=$(python -c "import json;print(json.load(open('feed/screener/latest.json'))['count'])")
          TITLE="📈 每日选股 技术评分≥$THRESH · $DATE($COUNT 只)"
          gh label create daily-screener --color 0E8A16 --description "每日技术评分选股清单" 2>/dev/null || true
          # push 路径触发/手动 dispatch 会让本工作流一天跑多次:已有当日 Issue 则更新,不再新开
          EXIST=$(gh issue list --state open --search "in:title 每日选股 $DATE" \
                    --json number --jq '.[0].number // empty')
          if [ -n "$EXIST" ]; then
            gh issue edit "$EXIST" --title "$TITLE" --body-file feed/screener/issue.md --add-label daily-screener
            echo "已更新当日 Issue #$EXIST"
          else
            EXIST=$(gh issue create --title "$TITLE" --body-file feed/screener/issue.md \
              --label daily-screener --assignee "${{ github.repository_owner }}" | grep -oE '[0-9]+$' || true)
            [ -n "$EXIST" ] && echo "已创建当日 Issue #$EXIST" || echo "issue create failed"
          fi
          # 只保留当日一张:旧日的选股 Issue 已被 /screener 与 feed/screener/history.json 取代,自动关闭防止长期堆积
          gh issue list --state open --limit 300 --search "in:title 每日选股" --json number,title \
            --jq '.[] | select(.title | contains("每日选股")) | .number' \
            | while read -r n; do
                if [ -n "$EXIST" ] && [ "$n" = "$EXIST" ]; then continue; fi
                gh issue close "$n" --comment "已被 $DATE 的清单取代(历史入库见 /tracker),自动关闭。" || echo "issue close failed: #$n"
              done
