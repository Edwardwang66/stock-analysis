name: Daily screener (技术评分≥80)

# 每个交易日美股收盘后扫描 标普500+纳指100,把评分≥80的清单:
#   1) 提交到 feed/screener/(供 /screener 页面实时读取)
#   2) 开一个 GitHub Issue 并指派给仓库所有者(GitHub 会邮件通知你)
on:
  schedule:
    # 美股收盘 16:00 ET ≈ 20:00/21:00 UTC;留富余在 22:30 UTC 周一到周五跑
    - cron: "30 22 * * 1-5"
  push:
    paths: ["backend/app/analysis/signals.py", "scripts/daily_screener.py"]
    branches: [main]
  workflow_dispatch:
    inputs:
      threshold:
        description: "技术评分阈值"
        default: "80"

permissions:
  contents: write   # 提交 feed/screener
  issues: write     # 创建 Issue

concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: 扫描并生成清单
        run: python scripts/daily_screener.py --threshold ${{ github.event.inputs.threshold || '80' }} --concurrency 10

      - name: 提交清单到 feed/screener
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/screener feed/watchlist.json feed/signals/rs-ranks.json feed/signals/rs-history.json
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "screener: 每日技术评分清单 $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((5*i))
          done
          echo "::error::push 失败(3次重试后)"; exit 1

      - name: 创建/更新当日 Issue(同日去重防刷屏)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%F)
          THRESH="${{ github.event.inputs.threshold || '80' }}"
          COUNT=$(python -c "import json;print(json.load(open('feed/screener/latest.json'))['count'])")
          TITLE="📈 每日选股 技术评分≥$THRESH · $DATE($COUNT 只)"
          # push 路径触发/手动 dispatch 会让本工作流一天跑多次:已有当日 Issue 则更新,不再新开
          EXIST=$(gh issue list --state open --search "in:title 每日选股 $DATE" \
                    --json number --jq '.[0].number // empty')
          if [ -n "$EXIST" ]; then
            gh issue edit "$EXIST" --title "$TITLE" --body-file feed/screener/issue.md
            echo "已更新当日 Issue #$EXIST"
          else
            gh issue create --title "$TITLE" --body-file feed/screener/issue.md \
              --assignee "${{ github.repository_owner }}" || echo "issue create failed"
          fi
