name: Feed watchdog (陈旧告警)

# 每日检查 feed/index.json 的 freshness.stale;陈旧则开 Issue 提醒(有未关闭的同类 Issue 时不重复开)。
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 检查新鲜度并按需开 Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STALE=$(python3 -c "import json;d=json.load(open('feed/index.json'));print(str(d.get('freshness',{}).get('stale',False)).lower())")
          AGE=$(python3 -c "import json;d=json.load(open('feed/index.json'));print(d.get('freshness',{}).get('data_age_days'))")
          echo "stale=$STALE data_age_days=$AGE"
          if [ "$STALE" != "true" ]; then echo "新鲜 ✓"; exit 0; fi
          EXISTING=$(gh issue list --label feed-stale --state open --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then echo "已有未关闭告警,跳过"; exit 0; fi
          gh label create feed-stale --color D93F0B --description "feed 数据陈旧" 2>/dev/null || true
          gh issue create \
            --title "⚠️ feed 数据陈旧(滞后 ${AGE} 天)" \
            --label feed-stale \
            --assignee "${{ github.repository_owner }}" \
            --body "feed/index.json 的 freshness.stale=true,数据滞后 ${AGE} 天。请检查 alpha-routine / OpenClaw 投递是否中断。情报看板:https://edwardwang66.github.io/stock-analysis/intel/"
