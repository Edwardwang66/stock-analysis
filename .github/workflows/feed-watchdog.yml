name: Feed watchdog (实效性+连贯性审计)

# 每日两次跑完整审计(scripts/audit_feed.py):实效性 SLA + 跨文件连贯性
# (持仓簿滞后/悬空引用/未来 asof/screener 系日期不一致/notes 覆盖率等)。
# 把 feed/health.json 写回仓库(看板①区消费);有 critical 问题时开 Issue 告警(去重)。
on:
  schedule:
    - cron: "0 9,21 * * *"        # 完整审计(原节奏)
    - cron: "25 0-20/1 * * 1-5"   # 交易时段每小时:三级备胎检查(live>30min 则补跑一轮盘中报告)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: feed-watchdog
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: 三级备胎:live 盘中流 >30 分钟陈旧则就地补跑一轮
        run: |
          git fetch origin live:live 2>/dev/null || true
          AGE=99999
          if git show live:feed/intraday/latest.json > /tmp/live_latest.json 2>/dev/null; then
            AGE=$(python -c "import json,datetime as d; at=json.load(open('/tmp/live_latest.json')).get('at',''); print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(at)).total_seconds()) if at else 99999)" 2>/dev/null || echo 99999)
          fi
          echo "live 年龄 ${AGE}s"
          if [ "$AGE" -lt 1800 ]; then echo "盘中流健康,跳过"; exit 0; fi
          echo "⚠️ 盘中流断流(${AGE}s),三级备胎补跑"
          git worktree add /tmp/live live 2>/dev/null || true
          mkdir -p /tmp/live/feed/intraday
          cp /tmp/live_latest.json /tmp/live/feed/intraday/latest.json 2>/dev/null || true
          INTRADAY_OUT=/tmp/live/feed/intraday/latest.json INTRADAY_PRODUCER=watchdog python scripts/intraday_report.py || exit 0
          cd /tmp/live
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/intraday/latest.json
          git diff --cached --quiet || { git commit -m "intraday: $(date -u +%H:%M) (watchdog兜底)"; git push origin live || true; }
      - name: 运行审计并写 health.json
        id: audit
        run: |
          set +e
          python scripts/audit_feed.py --write | tee /tmp/audit.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          {
            echo "report<<AUDIT_EOF"
            cat /tmp/audit.txt
            echo "AUDIT_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: 提交 health.json
        run: |
          git config user.name  "feed-watchdog[bot]"
          git config user.email "actions@github.com"
          git add feed/health.json
          if git diff --cached --quiet; then
            echo "health 无变化"
          else
            git commit -m "watchdog: 更新 feed/health.json"
            git pull --rebase origin main || true
            git push || echo "push 失败(可能与其它任务竞争),下轮重试"
          fi
      - name: critical 时开 Issue(去重)
        if: steps.audit.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.audit.outputs.report }}
        run: |
          EXISTING=$(gh issue list --label feed-stale --state open --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then echo "已有未关闭告警,跳过"; exit 0; fi
          gh label create feed-stale --color D93F0B --description "feed 数据陈旧/不连贯" 2>/dev/null || true
          gh issue create \
            --title "⚠️ feed 审计发现 critical 问题" \
            --label feed-stale \
            --assignee "${{ github.repository_owner }}" \
            --body "$(printf '审计输出:\n```\n%s\n```\n看板: https://edwardwang66.github.io/stock-analysis/intel/' "$REPORT")"
