name: Dependabot auto-merge (依赖升级自动合并)

# Dependabot PR 的自动合并闸门:先真实构建/测试,通过才合并,免去逐个手点。
#   - npm(/frontend):npm ci + next build(静态导出)通过才合
#   - pip(/backend):装依赖 + 跑 backend/tests 冒烟通过才合
#   - github-actions:无构建可验,minor/patch 直接合
#   - 只自动合 minor/patch;major 一律留人工(npm/pip 的 major 已在 dependabot.yml ignore,
#     actions 的 major 可能要配套改 workflow,如 upload-pages-artifact 与 deploy-pages 的版本配对)
#
# 注:Dependabot 触发的 run 里 GITHUB_TOKEN 默认只读,靠下面 permissions 提权(GitHub 官方姿势)。
#    用 GITHUB_TOKEN 合并不会触发 main 的 push 工作流,所以前端依赖合并后显式 dispatch deploy-pages。

on: pull_request

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  build-frontend:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 静态导出前剔除边缘函数目录(与 deploy-pages 保持一致)
        run: rm -rf app/api
      - run: npm run build

  test-backend:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/pip/')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python tests/test_backend.py
      - run: python tests/test_api.py

  merge:
    needs: [build-frontend, test-backend]
    # 闸门跳过(如 actions 升级两个门都不适用)也放行,失败则拦下
    if: >-
      !cancelled() &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      needs.build-frontend.result != 'failure' &&
      needs.test-backend.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: 合并 minor/patch(major 留人工)
        id: merge
        if: contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.meta.outputs.update-type)
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 无分支保护时直接合;若日后加了 required checks,回退到排队 auto-merge
        run: gh pr merge --squash "$PR_URL" || gh pr merge --auto --squash "$PR_URL"
      - name: 前端依赖合并后重新部署 Pages
        if: steps.merge.outcome == 'success' && steps.meta.outputs.package-ecosystem == 'npm_and_yarn'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh pr view "$PR_URL" --json merged --jq .merged)" = "true" ]; then
            gh workflow run deploy-pages.yml --ref main
          fi
