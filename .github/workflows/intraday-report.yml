name: Intraday report (盘中5分钟机器报告)

# 覆盖:全球时段(亚→欧→美接力,00:00-20:00 UTC 工作日)。
# ⚠️ GitHub 对 */5 高频 cron 会静默丢弃(2026-06-10 实测 Winter 睡后备胎 4 小时没接上)。
# 对策:*/15 调度(成功率高)+ 每次 run 内部三轮循环(轮间 sleep 310s>守卫290s,避免第二轮被自己第一轮触发退位),
#      维持 5 分钟节拍;public 仓库 Actions 分钟免费,sleep 不构成成本问题。
# 备胎守卫仍生效:每轮先查 live 新鲜度,Winter 循环在岗(<290s)即跳过该轮。
# 产物经 git worktree 直接提交 live 分支(不切换主工作区,避免 stash 竞态)。
on:
  schedule:
    - cron: "*/15 0-20 * * 1-5"
  push:
    paths: ["scripts/intraday_report.py"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 自续链 gh workflow run 必需

concurrency:
  group: intraday-report
  cancel-in-progress: false   # true 会连环取消排队中的 run(高峰 runner 排队>15min 时永远轮空)

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: 准备 live 工作树
        run: |
          git fetch origin live:live 2>/dev/null || git branch live
          git worktree add /tmp/live live
      - name: 三轮循环(5 分钟节拍 × 3,内嵌备胎守卫)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            cd /tmp/live && git pull --ff-only origin live 2>/dev/null || true
            cd "$GITHUB_WORKSPACE"
            AGE=$(python -c "import json,datetime as d; at=json.load(open('/tmp/live/feed/intraday/latest.json')).get('at',''); print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(at)).total_seconds()) if at else 99999)" 2>/dev/null || echo 99999)
            echo "第 ${i} 轮:live 数据年龄 ${AGE}s"
            if [ "$AGE" -ge 290 ]; then
              mkdir -p /tmp/live/feed/intraday
              INTRADAY_OUT=/tmp/live/feed/intraday/latest.json INTRADAY_PRODUCER=actions-backup python scripts/intraday_report.py || true
              cd /tmp/live
              # -f:live 分支基点的 .gitignore 拦 feed/intraday/,文件未跟踪时裸 add 退出码 1(首跑实测)
              git add -f feed/intraday/latest.json
              if ! git diff --cached --quiet; then
                git commit -m "intraday: $(date -u +%H:%M)"
                git push origin live || { git pull --rebase origin live && git push origin live; } || true
              fi
              cd "$GITHUB_WORKSPACE"
            else
              echo "Winter 循环在岗,本轮退位"
            fi
            # 顺手保活 Render(替代 keep-warm 高频 schedule)
            curl -fsS --max-time 20 "${{ vars.API_BASE }}/api/v1/health" >/dev/null 2>&1 || true
            [ "$i" -lt 2 ] && sleep 310 || true
          done
      - name: 自续链:调起下一棒(GITHUB_TOKEN 实验;失败则靠 cron/watchdog 重新点火)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 仅交易时段自续(00:00-20:00 UTC 工作日),避免夜里空转
          H=$(date -u +%H); DOW=$(date -u +%u)
          if [ "$DOW" -le 5 ] && [ "$H" -lt 20 ]; then
            for r in 1 2 3; do
              gh workflow run intraday-report.yml --ref main && { echo "下一棒已调起"; break; }
              echo "自续第 ${r} 次失败,20s 后重试…"; sleep 20
            done
          else
            echo "非交易时段,链止"
          fi
