name: Hyperliquid monitor (衍生品情报 2h)

# 每 2 小时拉 Hyperliquid 公开接口:
#   主 DEX 230 永续持仓面(funding/OI/premium,拥挤监控 §7.2)
#   + HIP-3 builder DEX 合成美股/指数/私有公司永续(24/7 盘后价格发现)
#   + 跨所预测资金费错位(HL vs Binance/Bybit)
# 写 feed/crypto/state.json + 发布 feed 报告,commit 回仓。加密 24/7,周末照跑。

on:
  schedule:
    - cron: "10 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hyperliquid-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FEED_PUBLICATION_MANIFEST: /tmp/feed-publication-${{ github.run_id }}.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: 运行监控
        env:
          FEED_HMAC_SECRET: ${{ secrets.FEED_HMAC_SECRET }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/hyperliquid_monitor.py --publish
      - name: Pre-IPO/24-7 历史追加(幂等)
        run: python scripts/preipo_history.py
      - name: Commit + push
        run: |
          git config user.name  "hl-monitor[bot]"
          git config user.email "actions@github.com"
          python scripts/feed_publication.py stage "$FEED_PUBLICATION_MANIFEST"
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "hl: 衍生品情报快照 ($(date -u +%Y-%m-%dT%H:%MZ))"
            pushed=0
            for i in 1 2 3 4; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              if [ "$i" -lt 4 ]; then sleep $((2**i)); fi
            done
            if [ "$pushed" -ne 1 ]; then echo "push 重试耗尽。" >&2; exit 1; fi
          fi
