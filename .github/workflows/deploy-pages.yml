name: Deploy frontend to GitHub Pages

# 把 frontend/ 的 Next.js 静态导出发布到 GitHub Pages。
# 启用方法:仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
on:
  push:
    branches: [claude/stock-platform-research-V6KoP, main]
    paths: ["frontend/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build (static export)
        env:
          # 项目站点路径 = /<repo>
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # 后端地址:在仓库 Settings → Secrets and variables → Actions → Variables
          # 新增 API_BASE = https://你的后端域名 后,前端即自动改用后端(摆脱公共代理)。
          # 未设置时为空,前端回退到浏览器直连公开 API。
          NEXT_PUBLIC_API_BASE: ${{ vars.API_BASE }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
