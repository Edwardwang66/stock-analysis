name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", "feed/schema/**", ".node-version", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify exact Node and npm
        run: |
          test "$(node --version)" = "v24.14.0"
          test "$(npm --version)" = "11.9.0"
      - name: Bundle latest feed snapshot
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/feed-snapshot"
          rm -rf "$snapshot"
          mkdir -p "$snapshot"
          sources=(
            feed/index.json
            feed/health.json
            feed/watchlist.json
            feed/schema
            feed/reports
            feed/signals
            feed/market
            feed/factory
            feed/screener
            feed/stock-notes
            feed/crypto
            feed/intraday
            feed/funds
          )
          for source in "${sources[@]}"; do
            test -e "$source"
          done
          cp -R -- "${sources[@]}" "$snapshot/"
      - run: npm ci
      - name: Build and smoke static profile
        env:
          STATIC_FEED_SOURCE: ${{ runner.temp }}/feed-snapshot
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          NEXT_PUBLIC_API_BASE: ${{ vars.API_BASE }}
          NEXT_PUBLIC_EDGE_BASE: ${{ vars.EDGE_BASE }}
          NEXT_PUBLIC_FEED_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/feed
        run: |
          npm run build:static
          npm run smoke:static
      - name: Verify complete exported feed snapshot
        run: |
          set -euo pipefail
          entries=(
            index.json
            health.json
            watchlist.json
            schema
            reports
            signals
            market
            factory
            screener
            stock-notes
            crypto
            intraday
            funds
          )
          for entry in "${entries[@]}"; do
            test -e "out/feed/$entry"
          done
          test -f out/feed/funds/situational-awareness.json
          test -f out/feed/intraday/latest.json
          test -f out/feed/intraday/overnight.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
