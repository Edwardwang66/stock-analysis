name: OpenClaw delivery watchdog (盘中节拍 SLA)

# 三个硬性时点的及时性守卫(playbook §7):
#   盘前 report  deadline 13:30 UTC → 13:40 检查
#   收盘前 report deadline 19:30 UTC → 19:45 检查
# 缺投 → 同类只维护一张滚动 Issue(label: openclaw-miss):已有则把标题/正文更新到当日,
# 不再每天新开;当天按时投递后自动关闭。收盘后全量覆盖率由 daily-digest 审计,这里不重复。
on:
  schedule:
    - cron: "40 13 * * 1-5"
    - cron: "45 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: openclaw-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 检查投递并维护滚动 Issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%F)
          HOUR=$(date -u +%H)
          if [ "$HOUR" -lt 16 ]; then KIND=premarket; LABEL="盘前"; DDL="13:30 UTC(美东 09:30 开盘前)"; else KIND=close; LABEL="收盘前"; DDL="19:30 UTC(美东 15:30)"; fi
          F="feed/screener/analysis-$KIND-$DATE.md"
          gh label create openclaw-miss --color D93F0B --description "OpenClaw 盘中节拍缺投" 2>/dev/null || true
          # 同类(盘前/收盘前)现有的未关闭滚动 Issue,按编号升序
          OPEN=$(gh issue list --label openclaw-miss --state open --limit 100 --json number,title \
                   --jq '[.[] | select(.title | contains("'"$LABEL"'报告缺投"))] | sort_by(.number) | .[].number')
          if [ -f "$F" ]; then
            echo "✅ $F 已按时投递"
            for n in $OPEN; do
              gh issue close "$n" --comment "✅ $DATE ${LABEL}报告已按时投递(\`$F\`),自动关闭。" || echo "issue close failed: #$n"
            done
            exit 0
          fi
          echo "❌ $F 缺投"
          {
            echo "**${LABEL} report 未在 deadline(${DDL})前投递。**"
            echo
            echo "期望文件:\`$F\`(playbook §7 硬性时点)。最近一次缺投:$DATE;本 Issue 为同类滚动跟踪,每天缺投只更新不新开。"
            echo
            echo "排查顺序:"
            echo "1. Winter 的常驻循环还活着吗?(ps aux | grep winter_intraday_loop,挂了重启)"
            echo "2. 她的 LLM 侧当天跑了吗?(检查 openclaw_daily / 盘前例程日志)"
            echo "3. push 撞车?(git pull --rebase origin main 后重投)"
            echo
            echo "恢复投递后下一次检查会自动关闭本 Issue;也可补投后手动关闭。"
            echo "_由 openclaw-watchdog.yml 自动生成。_"
          } > /tmp/body.md
          TITLE="⏰ OpenClaw ${LABEL}报告缺投 $DATE"
          FIRST=$(printf '%s\n' $OPEN | head -n1)
          if [ -n "$FIRST" ]; then
            gh issue edit "$FIRST" --title "$TITLE" --body-file /tmp/body.md && echo "已更新滚动 Issue #$FIRST" || echo "issue edit failed"
            for n in $(printf '%s\n' $OPEN | tail -n +2); do
              gh issue close "$n" --comment "合并到 #$FIRST 滚动跟踪,自动关闭。" || echo "issue close failed: #$n"
            done
          else
            gh issue create \
              --title "$TITLE" \
              --label openclaw-miss \
              --assignee "${{ github.repository_owner }}" \
              --body-file /tmp/body.md || echo "issue create failed"
          fi
