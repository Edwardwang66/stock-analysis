name: Premarket pack (盘前隔夜要素包)

# 每个交易日 12:40 UTC(美东 ~08:40,开盘前 50 分钟):
# 期货/亚欧指数/隔夜加密/昨日异动 → feed/intraday/overnight.json
# OpenClaw 盘前 report(13:00-13:30 UTC)直接引用,不用自己抓数。
# 顺带把 live 分支的盘中快照 latest.json 作为每日副本提交到 main
# (审计 SLA、Pages 捆绑快照与 /desk 兜底都读 main 副本;盘中 5 分钟真值仍只进 live 分支)。
on:
  schedule:
    - cron: "40 12 * * 1-5"
  push:
    paths: ["scripts/premarket_pack.py"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: premarket-pack
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: 取 live 分支的盘中快照(main 上的 latest.json 是每日副本,真数据在 live)
        run: |
          git fetch origin live --depth 1 2>/dev/null \
            && git checkout origin/live -- feed/intraday/latest.json 2>/dev/null \
            || echo "live 分支不可用,回退 main 副本"
      - name: 生成要素包
        run: python scripts/premarket_pack.py
      - name: 提交(rebase 防撞车)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # overnight.json 是本工作流产物;latest.json 是刚从 live 取来的盘中快照,作为 main 的每日副本一并提交
          git add feed/intraday/overnight.json feed/intraday/latest.json
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "premarket: 盘前要素包 $(date -u +%F)"
          pushed=0
          for i in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then pushed=1; break; fi
            if [ "$i" -lt 4 ]; then sleep $((2**i)); fi
          done
          if [ "$pushed" -ne 1 ]; then echo "::error::push 重试耗尽(4 次)"; exit 1; fi
