name: Daily digest (日报 Issue + 选股入库)

# 每个交易日美股收盘后(在 daily-screener 22:30 之后):
#   选股入库 feed/screener/history.json(/tracker 看板数据源)
#   + 昨日选股表现 + 自选池异动 + 市场快照 → 开 Issue 指派 owner(邮件推送)
on:
  schedule:
    - cron: "30 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 生成日报 + 开 Issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/daily_digest.py
      - name: 提交选股历史(rebase 防并发)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed/screener/history.json feed/stock-notes/stance-history.json
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "screener: 选股追踪入库 $(date -u +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
