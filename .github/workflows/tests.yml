name: Tests (单元测试闸门)

# 后端 + scripts 引擎的单元/冒烟测试:push 到 main 与 PR 都跑,红了立刻暴露。
# (dependabot 升级 PR 也会被本闸门覆盖 —— backend/** 改动即触发)
on:
  push:
    branches: [main]
    paths: ["backend/**", "scripts/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["backend/**", "scripts/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: 后端 HTTP/数据层冒烟
        working-directory: backend
        run: |
          python tests/test_backend.py
          python tests/test_api.py
      - name: scripts 引擎单测(缠论引擎 + 投递闸门)
        run: |
          python scripts/tests/test_chan_engine.py
          python scripts/tests/test_validate_feed.py
